plugins {
    id 'com.android.application'
}

android {
    namespace 'home.hearth.chat'
    compileSdk 35

    defaultConfig {
        applicationId 'home.hearth.chat'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '4.0.1'
    }

    sourceSets {
        main.assets.srcDirs = ['../web']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
